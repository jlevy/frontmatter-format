name: Publish to PyPI

on:
  release:
    types: [published]

env:
  # Supply-chain cool-off: only consider releases older than this, so the publish
  # build never resolves packages too new to have been vetted. uv (>= 0.9, and the
  # version pinned below) accepts a relative duration directly. See the Supply Chain
  # Hardening section in docs/development.md.
  UV_EXCLUDE_NEWER: "14 days"
  # Keep machine-level uv configuration out of the reviewed project graph.
  UV_NO_CONFIG: "1"
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandatory for OIDC.
      contents: read
    steps:
      - name: Checkout (official GitHub action)
        # Pinned to a full commit SHA (see supply-chain notes in
        # docs/development.md); bump deliberately when updating.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Important for versioning plugins:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv (official Astral action)
        # Pinned to a full commit SHA (see note in ci.yml).
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.25"
          # uv-x86_64-unknown-linux-gnu.
          checksum: "1db18b5e76fa645a7f3865773139bdec8e2d46adbdbb35e7410b34fa8015ccd2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Verify release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable vMAJOR.MINOR.PATCH form: ${RELEASE_TAG}" >&2
            exit 1
          fi
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"

      - name: Verify lockfile
        run: uv lock --check

      - name: Install all dependencies
        # --frozen: install exactly from the committed uv.lock, never re-resolving
        # (UV_EXCLUDE_NEWER, set above, governs any resolution that does happen).
        run: uv sync --all-extras --all-groups --frozen

      - name: Run linting
        run: uv run --frozen python devtools/lint.py --check

      - name: Verify linting did not modify tracked files
        run: git diff --exit-code

      - name: Run tests
        run: uv run --frozen pytest

      - name: Build package
        run: uv build --no-build-isolation

      - name: Validate release artifacts
        shell: bash
        run: |
          expected_version="${RELEASE_TAG#v}"
          uv run --frozen python devtools/check_dist.py dist --version "${expected_version}"

      - name: Smoke-test release artifacts
        shell: bash
        run: |
          expected_version="${RELEASE_TAG#v}"
          wheel="dist/frontmatter_format-${expected_version}-py3-none-any.whl"
          sdist="dist/frontmatter_format-${expected_version}.tar.gz"
          for artifact in "${wheel}" "${sdist}"; do
            EXPECTED_VERSION="${expected_version}" \
              uv run --isolated --no-project --with "${artifact}" python -c \
              'import os; from importlib.metadata import version; import frontmatter_format; assert version("frontmatter-format") == os.environ["EXPECTED_VERSION"]'
          done

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        # Although uv is newer and faster, the "official" publishing option is the one from PyPA,
        # which uses twine. If desired, replace `uv publish` with a reviewed full SHA:
        # uses: pypa/gh-action-pypi-publish@FULL_COMMIT_SHA # reviewed release/v1 commit
